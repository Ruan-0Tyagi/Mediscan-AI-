<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediScan AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: black;
}

.bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: url("bg.png") no-repeat center center;
    background-size: contain;
}


.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0.3), rgba(0,0,0,0.8));
}

.top-buttons {
    position: absolute;
    top: 20px;
    right: 20px;
}

.top-buttons button {
    margin-left: 10px;
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: #00e5ff;
    cursor: pointer;
    font-weight: bold;
}

.center-content {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
}

.explore-btn {
    padding: 18px 40px;
    font-size: 20px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg,#00f0ff,#0077ff);
    color: black;
    box-shadow: 0 0 20px cyan;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- <div class="top-buttons">
    <button onclick="location.href='login.html'">Login</button>
    <button onclick="location.href='signup.html'">Sign Up</button>
</div> -->

<div class="center-content">
    <button class="explore-btn" onclick="location.href='index.html'">
        Explore MediScan AI
    </button>
</div>

</body>
</html>
