<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediScan AI | Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #020b1a, #001f3f);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
}

.glass-box {
    width: 360px;
    padding: 40px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(0,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    text-align: center;
    color: white;
}

h2 {
    margin-bottom: 20px;
    color: #00f0ff;
}

input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(0,0,0,0.4);
    color: #00f0ff;
    font-size: 14px;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(90deg, #00f0ff, #0077ff);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px #00f0ff;
}

button:hover {
    transform: scale(1.05);
}

.note {
    font-size: 12px;
    margin-top: 15px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="glass-box">
    <h2>Create Your MediScan AI Account</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="signupUser()">Request Access</button>
    <div class="note">
        Access will be granted after admin approval.
    </div>
</div>

<script>
async function signupUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("Please enter email and password");
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:5000/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.message) {
            alert(data.message);
            window.location.href = "login.html";
        } else if (data.error) {
            alert(data.error);
        } else {
            alert("Unexpected server response.");
        }
    } catch (err) {
        alert("Backend not reachable. Please run app.py");
    }
}
</script>

</body>
</html>
